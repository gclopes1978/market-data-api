
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege
permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag market-data-api:smoke .

      - name: Start container
        run: |
          docker run --detach \
            --name market-data-api-smoke \
            --publish 127.0.0.1:18080:8080 \
            market-data-api:smoke

      - name: Smoke test health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if ! docker inspect --format='{{.State.Running}}' market-data-api-smoke | grep -q '^true$'; then
              echo "Container stopped unexpectedly."
              exit 1
            fi

            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/health > /dev/null; then
              echo "Health endpoint returned HTTP 200."
              exit 0
            fi

            sleep 2
          done

          echo "Health endpoint did not return HTTP 200 within 60 seconds."
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs market-data-api-smoke || true

      - name: Remove container
        if: always()
        run: docker rm --force market-data-api-smoke || true
