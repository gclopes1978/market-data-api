# Continuous integration for pull requests into main and pushes to main.
# This workflow validates source and the runnable container; it does not publish an image.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege at workflow scope. The build-test job adds PR write access only for its report comment.
permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # required only for the optional coverage/failure comment below
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Restore once, then build Release binaries reused by the test command.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release 2>&1 | tee build.log

      # Collect Cobertura output so the next steps can publish a readable summary and enforce a threshold.
      - name: Test (with coverage)
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage
          2>&1 | tee test.log

      # always() preserves diagnostics even when build/test fails; the summary is also attached to the run.
      - name: Coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage/report \
            -assemblyfilters:"+MarketData.*;-MarketData.Tests" \
            -reporttypes:"MarkdownSummaryGithub;TextSummary"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Treat coverage as a quality gate, not just a metric displayed in the job summary.
      - name: Enforce minimum line coverage
        env:
          MIN_LINE_COVERAGE: "80"
        run: |
          line=$(grep -oP 'Line coverage: \\K[0-9.]+' coverage/report/Summary.txt | head -1)
          echo "Line coverage: ${line}% (minimum ${MIN_LINE_COVERAGE}%)"
          awk -v v="$line" -v min="$MIN_LINE_COVERAGE" 'BEGIN { exit (v + 0 >= min + 0) ? 0 : 1 }'

      # Fork PRs may not receive a write token; keep reporting best-effort without masking test results.
      - name: Comment coverage and failures on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true # forks get a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Coverage"
            echo '```'
            cat coverage/report/Summary.txt 2>/dev/null || echo "No coverage report was produced."
            echo '```'
            echo "### Build/test problems (filtered log)"
            echo '```'
            cat build.log test.log 2>/dev/null \
              | grep -E "error (CS|MSB|NU)[0-9]+|\\[FAIL\\]|Failed |Error Message|Assert\\.|Expected:|Actual:|Stack Trace|   at MarketData" \
              | awk '!seen[$0]++' | head -150 || true
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md --edit-last --create-if-none \
            || gh pr comment "$PR_NUMBER" --body-file comment.md

  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Exercise the same Dockerfile used for deployment, not a separate test-only image.
      - name: Build Docker image
        run: docker build --pull --tag market-data-api:smoke .

      # Bind only to loopback on the runner; no external port is exposed.
      - name: Start container
        run: |
          docker run --detach \
            --name market-data-api-smoke \
            --publish 127.0.0.1:18080:8080 \
            market-data-api:smoke

      # Wait up to 60 seconds for ASP.NET Core to become healthy.
      - name: Smoke test health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if ! docker inspect --format='{{.State.Running}}' market-data-api-smoke | grep -q '^true$'; then
              echo "Container stopped unexpectedly."
              exit 1
            fi

            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/health > /dev/null; then
              echo "Health endpoint returned HTTP 200."
              exit 0
            fi

            sleep 2
          done

          echo "Health endpoint did not return HTTP 200 within 60 seconds."
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs market-data-api-smoke || true

      # Cleanup also runs after a failed smoke test.
      - name: Remove container
        if: always()
        run: docker rm --force market-data-api-smoke || true
